const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decryptWith(rawKey){
  const buf=b64(DATA), iv=buf.slice(0,12), ct=buf.slice(12);
  const key=await crypto.subtle.importKey('raw',rawKey,'AES-GCM',false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct);
  return new TextDecoder().decode(pt);
}
function show(html){document.open();document.write(html);document.close();}
async function derive(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:b64(SALT),iterations:ITER},base,256));
}
const toB64=u=>btoa(String.fromCharCode(...u));
window.addEventListener('load',async()=>{
  const saved=localStorage.getItem(KEYNAME)||sessionStorage.getItem(KEYNAME);
  if(saved){try{show(await decryptWith(b64(saved)));}catch(e){localStorage.removeItem(KEYNAME);sessionStorage.removeItem(KEYNAME);}}
});
document.getElementById('f').addEventListener('submit',async e=>{
  e.preventDefault();
  const err=document.getElementById('err'),go=document.getElementById('go');
  err.textContent='';go.disabled=true;go.textContent='Verificando…';
  try{
    const raw=await derive(document.getElementById('pw').value);
    const html=await decryptWith(raw);
    const k=toB64(raw);
    try{(document.getElementById('rem').checked?localStorage:sessionStorage).setItem(KEYNAME,k);}catch(_){}
    show(html);
  }catch(_){err.textContent='Clave incorrecta.';go.disabled=false;go.textContent='Ingresar';}
});
</script></body></html>
